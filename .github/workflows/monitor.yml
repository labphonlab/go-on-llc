name: Site monitor

# 公開中のサイトを外から毎日確認する。
#   - sitemap.xml に載る全ページが 200 で返るか
#   - 外部リンクが生きているか
#   - 独自ドメインが GitHub Pages を向き始めたら、自動でデプロイし直して切り替える
# 異常があれば site-monitor ラベルの Issue を立てる（既にあればコメントを足す）。
on:
  schedule:
    - cron: "0 22 * * *" # 毎日 07:00 JST
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write # DNS開通を検出したときに deploy を起動する

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # 独自ドメインが本番。応答しない場合だけプロジェクトURLへ退避する。
      - name: Decide which URL is live
        run: |
          set -euo pipefail
          if curl -sfI -m 20 https://goonresearch.jp/ >/dev/null 2>&1; then
            echo "LIVE_URL=https://goonresearch.jp/" >> "$GITHUB_ENV"
          else
            echo "LIVE_URL=https://labphonlab.github.io/go-on-llc/" >> "$GITHUB_ENV"
          fi

      # DNSが通ったのに、まだプロジェクトURLで配信していれば切り替える。
      # deploy.yml は配信先をDNSから判定するので、起動するだけで独自ドメイン向けに出る。
      - name: Switch to the custom domain once DNS lands
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153"
          resolved="$(getent ahostsv4 goonresearch.jp | awk '{print $1}' | sort -u || true)"
          missing=0
          for ip in $expected; do grep -qx "$ip" <<<"$resolved" || missing=1; done

          if [ "$missing" -eq 0 ] && [ "$LIVE_URL" != "https://goonresearch.jp/" ]; then
            echo "DNSは通っていますが、まだ独自ドメインで配信できていません。デプロイし直します。"
            gh workflow run "Deploy to GitHub Pages" --ref main
          else
            echo "切り替えは不要です。"
          fi

      - name: Check the live site
        run: node scripts/health-check.mjs 2>&1 | tee health.log

      - name: Check external links
        if: always()
        run: |
          npm run build
          node scripts/check-links.mjs --external 2>&1 | tee -a health.log

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$(printf 'サイト監視で異常を検出しました。\n\n```\n%s\n```\n\n実行ログ: %s\n' "$(tail -40 health.log)" "$RUN_URL")"
          existing="$(gh issue list --label site-monitor --state open --limit 1 --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create site-monitor --color B60205 --description "サイト監視の自動通知" 2>/dev/null || true
            gh issue create --title "サイト監視: 異常を検出" --label site-monitor --body "$body"
          fi

      - name: Close the alert once healthy
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh issue list --label site-monitor --state open --limit 1 --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "監視が正常に戻ったため自動でクローズしました。"
          fi
