name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ---------------------------------------------------------------------
      # 配信先を実際のDNSから決める。
      #
      # goonresearch.jp が GitHub Pages の A レコード4本を向いていれば独自ドメイン
      # 向けにビルドし、CNAME を同梱する。まだ向いていなければプロジェクトURL
      # （https://labphonlab.github.io/go-on-llc/）向けにビルドし、CNAME は外す。
      # CNAME を置いたまま名前解決できないと、GitHub が到達しない独自ドメインへ
      # 切り替えてサイトごと見えなくなるため、この判定を人手に任せない。
      # ---------------------------------------------------------------------
      - name: Choose the deploy target
        run: |
          set -euo pipefail
          apex=goonresearch.jp
          expected="185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153"
          resolved="$(getent ahostsv4 "$apex" | awk '{print $1}' | sort -u || true)"

          missing=0
          for ip in $expected; do
            grep -qx "$ip" <<<"$resolved" || missing=1
          done

          if [ "$missing" -eq 0 ]; then
            echo "✔ $apex は GitHub Pages を向いています。独自ドメイン向けにビルドします。"
            echo "SITE_URL=https://goonresearch.jp" >> "$GITHUB_ENV"
            echo "SITE_BASE=/" >> "$GITHUB_ENV"
          else
            echo "… $apex はまだ GitHub Pages を向いていません（解決結果: ${resolved:-なし}）。"
            echo "  プロジェクトURL向けにビルドし、CNAME は同梱しません。"
            echo "SITE_URL=https://labphonlab.github.io" >> "$GITHUB_ENV"
            echo "SITE_BASE=/go-on-llc/" >> "$GITHUB_ENV"
            rm -f public/CNAME
          fi

      - name: Install, build, and upload your site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
